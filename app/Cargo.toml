[package]
name = "app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "block_input"
path = "src/block_input.rs"

[[bin]]
name = "get_special_directory"
path = "src/get_special_directory.rs"

[[bin]]
name = "redirector_injection_test"
path = "src/redirctor_injection_test.rs"

[[bin]]
name = "redirector_transparency_test"
path = "src/redirector_transparency_test.rs"

[dependencies]
image = "0.25.9"
vnc_module = {path = "../vnc_module"}
inject = {path = "../inject"}
[dependencies.windows-sys]
version = "0.60.2"
features = [
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_System_Memory",
    "Win32_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Environment",
    "Win32_UI_Shell"
]
