[package]
name = "vnc_module"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile]
[profile.release]
opt-level = 3
debug = 0
strip = "symbols"

[dependencies]
inject = {path = "../inject"}
win_utils = {path = "../win_utils"}
[dependencies.image]
version = "0.25.9"
default-features = false
features = [
    "jpeg",
]
[dependencies.windows-sys]
version = "0.60.2"
features = [
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_System_Memory",
    "Win32_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Wdk_System_Threading",
    "Wdk_System_SystemInformation",
    "Wdk_Foundation",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Power",
    "Wdk_Foundation",
    "Wdk_System_Threading",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell"
]